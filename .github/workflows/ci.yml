name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests, lint, security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check backend/

      - name: Bandit
        run: bandit -r backend/app

      - name: Pytest (100% coverage required)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=100

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: aegisbreach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml
        run: AEGIS_API_KEY=ci-placeholder docker compose config --quiet

      - name: Start container (same hardening as docker-compose.yml)
        run: |
          key="ci-$(openssl rand -hex 24)"
          echo "::add-mask::$key"
          echo "SMOKE_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name aegis -p 8000:8000 \
            -e AEGIS_API_KEY="$key" \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            aegisbreach:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Container did not become healthy within 30s"
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8000
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          expect() {
            if [ "$2" != "$3" ]; then echo "::error::$1: expected $3, got $2"; exit 1; fi
            echo "ok  $1 -> $2"
          }

          # Responses are captured before grep: piping curl into grep -q under
          # pipefail can fail at random when grep exits before curl finishes.
          contains() {
            local body
            body="$(curl -fsS "$1")"
            grep -qF "$2" <<< "$body" || { echo "::error::$1 does not contain $2"; exit 1; }
          }

          # Dashboard and its client-side fallback are served.
          contains "$base/" '<div id="root"></div>'
          contains "$base/runs/abc123" '<div id="root"></div>'
          echo "ok  frontend served from / and /runs/abc123"

          # API keeps its own behaviour alongside the frontend.
          expect "GET /api/v1/health"            "$(status "$base/api/v1/health")" 200
          expect "GET /api/v1/mutators (no key)" "$(status "$base/api/v1/mutators")" 401
          expect "GET /api/v1/mutators (key)"    "$(status -H "X-API-Key: $SMOKE_KEY" "$base/api/v1/mutators")" 200
          expect "GET /api/v1/nope"              "$(status "$base/api/v1/nope")" 404
          expect "GET /docs"                     "$(status "$base/docs")" 200

          # Seed suites were copied into the image.
          contains "$base/api/v1/health" '"owasp_llm_top10"'
          echo "ok  seed suites present"

          # Process runs as the unprivileged user.
          uid="$(docker exec aegis id -u)"
          if [ "$uid" = "0" ]; then echo "::error::Container runs as root"; exit 1; fi
          echo "ok  running as uid $uid"

      - name: Container logs
        if: always()
        run: docker logs aegis 2>&1 || true

      - name: Stop container
        if: always()
        run: docker rm -f aegis || true
